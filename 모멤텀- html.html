< !DOCTYPE html><html lang="en"><head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>Pong Game</title><style> :root {
  --bg: #111827;
  --panel: #1f2937;
  --line: rgba(255, 255, 255, 0.2);
  --text: #f9fafb;
  --accent: #60a5fa;
  --paddle: #f3f4f6;
  --ball: #fbbf24;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: linear-gradient(180deg, #020817, #111827);
  color: var(--text);
  font-family: Arial, sans-serif;
}

.game-shell {
  background: rgba(17, 24, 39, 0.9);
  border: 2px solid var(--line);
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 0 25px rgba(0, 0, 0, 0.4);
}

#scoreboard {
  text-align: center;
  font-size: 2rem;
  font-weight: bold;
  margin-bottom: 12px;
  letter-spacing: 2px;
}

#scoreboard span {
  display: inline-block;
  min-width: 70px;
}

canvas {
  display: block;
  width: min(80vw, 800px);
  height: auto;
  background: #0b1220;
  border: 2px solid var(--line);
  border-radius: 10px;
  box-shadow: inset 0 0 20px rgba(255, 255, 255, 0.05);
}

</style></head><body><div class="game-shell"><div id="scoreboard"><span id="playerScore">0</span> : <span id="computerScore">0</span></div><canvas id="gameCanvas" width="800" height="600"></canvas></div><script>const canvas=document.getElementById("gameCanvas");
const ctx=canvas.getContext("2d");

const playerScoreEl=document.getElementById("playerScore");
const computerScoreEl=document.getElementById("computerScore");

const paddleWidth=12;
const paddleHeight=110;
const paddleSpeed=7;
const ballRadius=8;

const leftPaddle= {
  x: 26,
    y: canvas.height / 2 - paddleHeight / 2,
    width: paddleWidth,
    height: paddleHeight,
    speed: paddleSpeed
}

;

const rightPaddle= {
  x: canvas.width - 26 - paddleWidth,
    y: canvas.height / 2 - paddleHeight / 2,
    width: paddleWidth,
    height: paddleHeight,
    speed: 5.5
}

;

const ball= {
  x: canvas.width / 2,
    y: canvas.height / 2,
    radius: ballRadius,
    velocityX: 0,
    velocityY: 0,
    speed: 5
}

;

const keys= {
  ArrowUp: false,
    ArrowDown: false,
    w: false,
    s: false
}

;

let playerScore=0;
let computerScore=0;

function clamp(value, min, max) {
  return Math.min(Math.max(value, min), max);
}

function updateScoreboard() {
  playerScoreEl.textContent=playerScore;
  computerScoreEl.textContent=computerScore;
}

function resetBall(direction=1) {
  ball.x=canvas.width / 2;
  ball.y=canvas.height / 2;

  const baseSpeed=6;
  const angle=(Math.random() * 1.4) - 0.7; // between -0.7 and 0.7 radians

  ball.velocityX=direction * (baseSpeed + Math.random() * 1.5) * Math.cos(angle);
  ball.velocityY=(baseSpeed + Math.random() * 1.5) * Math.sin(angle);
}

function handlePaddleInput() {
  // Keyboard controls for left paddle
  let direction=0;

  if (keys.ArrowUp || keys.w) direction -=1;
  if (keys.ArrowDown || keys.s) direction+=1;

  leftPaddle.y+=direction * leftPaddle.speed;
  leftPaddle.y=clamp(leftPaddle.y, 0, canvas.height - leftPaddle.height);
}

function updateComputerPaddle() {
  const paddleCenter=rightPaddle.y+rightPaddle.height / 2;
  const ballCenter=ball.y;

  if (ball.velocityX > 0) {
    const difference=ballCenter - paddleCenter;

    if (Math.abs(difference) > 5) {
      rightPaddle.y+=Math.sign(difference) * rightPaddle.speed;
    }
  }

  rightPaddle.y=clamp(rightPaddle.y, 0, canvas.height - rightPaddle.height);
}

function detectPaddleCollision() {

  // Left paddle collision
  if (ball.x - ball.radius <=leftPaddle.x + leftPaddle.width && ball.x + ball.radius >=leftPaddle.x && ball.y >=leftPaddle.y && ball.y <=leftPaddle.y + leftPaddle.height && ball.velocityX < 0) {
    const relativeIntersectY=(ball.y - (leftPaddle.y + leftPaddle.height / 2)) / (leftPaddle.height / 2);
    const bounceAngle=relativeIntersectY * 1.1;

    ball.x=leftPaddle.x+leftPaddle.width+ball.radius;
    ball.velocityX=Math.abs(ball.velocityX)+0.4;
    ball.velocityY=ball.velocityX * Math.sin(bounceAngle) * 1.5;
  }

  // Right paddle collision
  if (ball.x + ball.radius >=rightPaddle.x && ball.x - ball.radius <=rightPaddle.x + rightPaddle.width && ball.y >=rightPaddle.y && ball.y <=rightPaddle.y + rightPaddle.height && ball.velocityX > 0) {
    const relativeIntersectY=(ball.y - (rightPaddle.y + rightPaddle.height / 2)) / (rightPaddle.height / 2);
    const bounceAngle=relativeIntersectY * 1.1;

    ball.x=rightPaddle.x - ball.radius;
    ball.velocityX=-Math.abs(ball.velocityX) - 0.4;
    ball.velocityY=Math.abs(ball.velocityX) * Math.sin(bounceAngle) * 1.5;
  }
}

function updateBall() {
  ball.x+=ball.velocityX;
  ball.y+=ball.velocityY;

  // Top/bottom wall collision
  if (ball.y - ball.radius <=0) {
    ball.y=ball.radius;
    ball.velocityY *=-1;
  }

  if (ball.y + ball.radius >=canvas.height) {
    ball.y=canvas.height - ball.radius;
    ball.velocityY *=-1;
  }

  // Score zones
  if (ball.x + ball.radius < 0) {
    computerScore++;
    updateScoreboard();
    resetBall(1);
  }

  if (ball.x - ball.radius > canvas.width) {
    playerScore++;
    updateScoreboard();
    resetBall(-1);
  }

  detectPaddleCollision();
}

function drawBackground() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Background
  ctx.fillStyle="#0b1220";
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Center dashed line
  ctx.setLineDash([12, 12]);
  ctx.strokeStyle="rgba(255,255,255,0.25)";
  ctx.beginPath();
  ctx.moveTo(canvas.width / 2, 0);
  ctx.lineTo(canvas.width / 2, canvas.height);
  ctx.stroke();
  ctx.setLineDash([]);

  // Subtle border
  ctx.strokeStyle="rgba(255,255,255,0.15)";
  ctx.strokeRect(1, 1, canvas.width - 2, canvas.height - 2);
}

function drawPaddle(x, y, width, height) {
  ctx.fillStyle="#f3f4f6";
  ctx.fillRect(x, y, width, height);
}

function drawBall() {
  ctx.beginPath();
  ctx.fillStyle="#fbbf24";
  ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
  ctx.fill();
}

function draw() {
  drawBackground();
  drawPaddle(leftPaddle.x, leftPaddle.y, leftPaddle.width, leftPaddle.height);
  drawPaddle(rightPaddle.x, rightPaddle.y, rightPaddle.width, rightPaddle.height);
  drawBall();
}

function gameLoop() {
  handlePaddleInput();
  updateComputerPaddle();
  updateBall();
  draw();
  requestAnimationFrame(gameLoop);
}

document.addEventListener("keydown", (event)=> {
    const key=event.key.toLowerCase();

    if (key==="arrowup" || key==="arrowdown" || key==="w" || key==="s") {
      event.preventDefault();
    }

    if (key==="arrowup" || key==="w") keys.ArrowUp=true;
    if (key==="arrowdown" || key==="s") keys.ArrowDown=true;
  });

document.addEventListener("keyup", (event)=> {
    const key=event.key.toLowerCase();

    if (key==="arrowup" || key==="w") keys.ArrowUp=false;
    if (key==="arrowdown" || key==="s") keys.ArrowDown=false;
  });

canvas.addEventListener("mousemove", (event)=> {
    const rect=canvas.getBoundingClientRect();
    const mouseY=((event.clientY - rect.top) / rect.height) * canvas.height;
    leftPaddle.y=clamp(mouseY - leftPaddle.height / 2, 0, canvas.height - leftPaddle.height);
  });

updateScoreboard();
resetBall(Math.random() < 0.5 ? -1 : 1);
requestAnimationFrame(gameLoop);
</script></body></html>
